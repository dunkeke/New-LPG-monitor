<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuantTrader | 能源与LPG量化套利监控</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-soft: #1e293bcc;
      --line: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --green: #22c55e;
      --red: #ef4444;
      --blue: #3b82f6;
      --purple: #a855f7;
      --orange: #f59e0b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      padding-bottom: 18px;
      border-bottom: 1px solid #1f2937;
      flex-wrap: wrap;
    }

    .title {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .clock {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      color: #cbd5e1;
    }

    .nav {
      display: inline-flex;
      margin-top: 18px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #0b1220;
      padding: 4px;
      gap: 4px;
    }

    .tab {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .tab.active {
      background: var(--blue);
      color: white;
    }

    .grid-4 {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
    }

    .card .label { color: var(--muted); font-size: 13px; }
    .card .value { margin-top: 6px; font-size: 26px; font-weight: 700; }
    .card .hint { margin-top: 4px; color: #64748b; font-size: 12px; }

    .section {
      margin-top: 16px;
      display: none;
      gap: 16px;
      flex-direction: column;
    }

    .section.active { display: flex; }

    .panel {
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
    }

    .panel h3 { margin: 0 0 10px; font-size: 17px; }

    .chart {
      width: 100%;
      height: 280px;
      background: #0b1220;
      border-radius: 10px;
      border: 1px solid #1e293b;
      display: block;
    }

    .two-col {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
    }

    .scanner-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 14px;
    }

    .signal {
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 14px;
    }

    .signal.open { border-color: #7e22ce88; }
    .signal.warning { border-color: #f59e0b88; }
    .signal.normal { opacity: 0.82; }

    .signal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .badge {
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 700;
    }

    .badge.open { background: #7e22ce33; color: #d8b4fe; }
    .badge.warning { background: #f59e0b33; color: #fcd34d; }
    .badge.normal { background: #334155; color: #cbd5e1; }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }

    .metric {
      background: #0b1220;
      border: 1px solid #1f2937;
      border-radius: 8px;
      padding: 8px;
    }

    .metric .k { color: #94a3b8; font-size: 11px; }
    .metric .v { margin-top: 5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    footer {
      margin-top: 24px;
      color: #64748b;
      text-align: center;
      border-top: 1px solid #1f2937;
      padding-top: 16px;
      font-size: 12px;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div>
        <h1 class="title">📊 QuantTrader | 能源与LPG量化套利监控</h1>
        <div class="subtitle">数据基准：东证期货能源数据周报 (2026-03-15) | 纯静态 HTML 单页应用</div>
      </div>
      <div id="clock" class="clock">系统时间：--:--:--</div>
    </header>

    <nav class="nav">
      <button class="tab active" data-tab="dashboard">盘面概览</button>
      <button class="tab" data-tab="arbitrage">量化套利雷达</button>
    </nav>

    <div class="grid-4" id="top-cards"></div>

    <section class="section active" id="dashboard">
      <div class="panel">
        <h3>油气跨品种价格走势对比 (SC vs PG)</h3>
        <canvas id="mainChart" class="chart" width="1120" height="280"></canvas>
      </div>
      <div class="two-col">
        <div class="panel">
          <h3>产业链利润演变 (PDH vs 烷基化)</h3>
          <canvas id="marginChart" class="chart" width="540" height="260"></canvas>
        </div>
        <div class="panel">
          <h3>PP-PG 盘面价差回归</h3>
          <canvas id="spreadChart" class="chart" width="540" height="260"></canvas>
        </div>
      </div>
    </section>

    <section class="section" id="arbitrage">
      <div class="panel">
        <h3>⚠️ 量化套利机会捕捉窗口（Arbitrage Scanner）</h3>
        <div id="signals" class="scanner-grid"></div>
      </div>
    </section>

    <footer>
      此系统专为量化/Paper Trader研究设计。可直接通过本地双击 <code>index.html</code> 打开，或部署到 GitHub Pages。<br />
      交易有风险，入市需谨慎。算法支持：历史百分位、Z-Score 标准化偏离度与均值回归。
    </footer>
  </div>

  <script>
    const mockTimeSeriesData = [
      { date: '03-01', SC: 610, PG: 4850, PP: 7200, PDH_Margin: 150, Alkylation_Margin: 200 },
      { date: '03-02', SC: 615, PG: 4880, PP: 7210, PDH_Margin: 120, Alkylation_Margin: 210 },
      { date: '03-03', SC: 608, PG: 4820, PP: 7180, PDH_Margin: 180, Alkylation_Margin: 190 },
      { date: '03-06', SC: 620, PG: 4950, PP: 7250, PDH_Margin: 80,  Alkylation_Margin: 250 },
      { date: '03-07', SC: 625, PG: 5010, PP: 7280, PDH_Margin: 40,  Alkylation_Margin: 280 },
      { date: '03-08', SC: 630, PG: 5080, PP: 7300, PDH_Margin: -20, Alkylation_Margin: 310 },
      { date: '03-09', SC: 628, PG: 5100, PP: 7290, PDH_Margin: -50, Alkylation_Margin: 330 },
      { date: '03-10', SC: 635, PG: 5050, PP: 7350, PDH_Margin: 80,  Alkylation_Margin: 270 },
      { date: '03-13', SC: 640, PG: 4980, PP: 7400, PDH_Margin: 190, Alkylation_Margin: 220 },
      { date: '03-14', SC: 645, PG: 4920, PP: 7450, PDH_Margin: 300, Alkylation_Margin: 180 },
      { date: '03-15', SC: 659.7, PG: 4850, PP: 7520, PDH_Margin: 450, Alkylation_Margin: 120 }
    ];

    const topCards = [
      { label: 'INE 原油 (SC)', value: '659.7', change: '+14.1%', hint: '日度环比强劲反弹', color: '#f87171' },
      { label: 'Brent-WTI 价差', value: '$4.43', change: '+1.47%', hint: '欧洲基本面相对偏紧', color: '#60a5fa' },
      { label: 'PG 主力合约', value: '4,850', change: '-1.4%', hint: '受进口成本预期拖累', color: '#4ade80' },
      { label: '高硫燃料油 (FU)', value: '4,730', change: '+0.19%', hint: '贴水SC原油明显收窄', color: '#f87171' }
    ];

    const arbitrageSignals = [
      {
        id: 1,
        type: '跨品种套利',
        name: 'PP-PG 盘面价差',
        currentSpread: 2670,
        historicalMean: 2200,
        zScore: 2.1,
        status: 'OPEN',
        direction: '做空PP，做多PG',
        logic: '价差处于历史高位，PDH利润回升压制PP端，LPG受原油支撑，存在均值回归机会。'
      },
      {
        id: 2,
        type: '内外盘套利',
        name: 'PG-FEI 进口窗口',
        currentSpread: 420,
        historicalMean: 150,
        zScore: -1.8,
        status: 'OPEN',
        direction: '正套 (多FEI，空PG)',
        logic: '考虑税费和运费后，进口利润打开，外盘相对低估。'
      },
      {
        id: 3,
        type: '产业链利润',
        name: 'PDH 盘面毛利',
        currentSpread: 450,
        historicalMean: 100,
        zScore: 2.5,
        status: 'WARNING',
        direction: '利润做缩',
        logic: '高利润可能刺激开工率回升，后续利润有收敛压力。'
      },
      {
        id: 4,
        type: '期现套利',
        name: 'PG 主力基差',
        currentSpread: -120,
        historicalMean: 50,
        zScore: -1.2,
        status: 'NORMAL',
        direction: '观望',
        logic: '基差偏弱但未出现明显无风险窗口。'
      }
    ];

    function renderCards() {
      document.getElementById('top-cards').innerHTML = topCards.map(card => `
        <article class="card">
          <div class="label">${card.label}</div>
          <div class="value">${card.value} <span style="font-size:14px;color:${card.color}">${card.change}</span></div>
          <div class="hint">${card.hint}</div>
        </article>
      `).join('');
    }

    function renderSignals() {
      document.getElementById('signals').innerHTML = arbitrageSignals.map(signal => {
        const statusClass = signal.status.toLowerCase();
        const zColor = Math.abs(signal.zScore) >= 2 ? '#f87171' : '#60a5fa';
        return `
          <article class="signal ${statusClass}">
            <div class="signal-head">
              <div>
                <div style="font-size:17px;font-weight:700">${signal.name}</div>
                <div style="font-size:12px;color:#94a3b8">${signal.type}</div>
              </div>
              <span class="badge ${statusClass}">${signal.status}</span>
            </div>
            <div class="metrics">
              <div class="metric"><div class="k">当前价差/利润</div><div class="v">${signal.currentSpread}</div></div>
              <div class="metric"><div class="k">历史均值 (60D)</div><div class="v">${signal.historicalMean}</div></div>
              <div class="metric"><div class="k">Z-Score</div><div class="v" style="color:${zColor}">${signal.zScore > 0 ? '+' : ''}${signal.zScore}σ</div></div>
            </div>
            <div style="font-size:13px;color:#cbd5e1"><b>策略建议：</b>${signal.direction}</div>
            <p style="margin:8px 0 0;color:#94a3b8;font-size:13px;line-height:1.6">${signal.logic}</p>
          </article>
        `;
      }).join('');
    }

    function setupTabs() {
      document.querySelectorAll('.tab').forEach(button => {
        button.addEventListener('click', () => {
          const target = button.dataset.tab;
          document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
          document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
          button.classList.add('active');
          document.getElementById(target).classList.add('active');
        });
      });
    }

    function updateClock() {
      document.getElementById('clock').textContent = `系统时间：${new Date().toLocaleTimeString('zh-CN')}`;
    }

    function drawAxes(ctx, width, height, labels) {
      const left = 45;
      const right = width - 10;
      const top = 14;
      const bottom = height - 26;

      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(left, top);
      ctx.lineTo(left, bottom);
      ctx.lineTo(right, bottom);
      ctx.stroke();

      ctx.fillStyle = '#94a3b8';
      ctx.font = '11px sans-serif';
      const step = (right - left) / (labels.length - 1);
      labels.forEach((label, i) => {
        const x = left + step * i;
        ctx.fillText(label, x - 12, bottom + 16);
      });

      return { left, right, top, bottom };
    }

    function plotLine(canvasId, seriesA, seriesB, min, max, colorA, colorB) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      const { width, height } = canvas;
      ctx.clearRect(0, 0, width, height);
      const labels = mockTimeSeriesData.map(d => d.date);
      const axis = drawAxes(ctx, width, height, labels);
      const xStep = (axis.right - axis.left) / (labels.length - 1);

      const toY = (value) => axis.bottom - ((value - min) / (max - min)) * (axis.bottom - axis.top);

      function draw(values, color) {
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        values.forEach((v, i) => {
          const x = axis.left + i * xStep;
          const y = toY(v);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();
      }

      draw(seriesA, colorA);
      draw(seriesB, colorB);

      ctx.fillStyle = '#cbd5e1';
      ctx.font = '12px sans-serif';
      ctx.fillText('红线: SC', axis.left + 6, axis.top + 14);
      ctx.fillText('绿线: PG', axis.left + 6, axis.top + 30);
    }

    function drawAllCharts() {
      const sc = mockTimeSeriesData.map(d => d.SC);
      const pg = mockTimeSeriesData.map(d => d.PG / 8);
      plotLine('mainChart', sc, pg, 560, 690, '#ef4444', '#22c55e');

      const pdh = mockTimeSeriesData.map(d => d.PDH_Margin);
      const alk = mockTimeSeriesData.map(d => d.Alkylation_Margin);
      plotLine('marginChart', pdh, alk, -80, 500, '#a855f7', '#f59e0b');

      const spread = mockTimeSeriesData.map(d => d.PP - d.PG);
      const mean = spread.map(() => 2200);
      plotLine('spreadChart', spread, mean, 2100, 2850, '#c084fc', '#22c55e');
    }

    renderCards();
    renderSignals();
    setupTabs();
    updateClock();
    drawAllCharts();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
